[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-diff"
version = "0.1.0"
description = "Classify what changed between two prompt versions: constraints, format, examples."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "khawajasafiullah18" }]
dependencies = []
keywords = ["prompts", "diff", "review", "llm", "regression"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/aiplusplus360/semantic-diff"

[project.scripts]
semantic-diff = "semanticdiff.cli:main"

[tool.setuptools.packages.find]
include = ["semanticdiff*"]
